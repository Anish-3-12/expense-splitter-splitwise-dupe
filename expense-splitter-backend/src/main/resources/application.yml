spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/expense_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:your_mysql_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:replace-me-with-a-long-random-secret-at-least-256-bits}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}   # 1 hour in milliseconds

app:
  default-currency: INR
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    secret: ${INTERNAL_API_SECRET:splitwise-ai-internal-secret-2026}
    timeout-ms: 120000
  storage:
    receipts-dir: ${RECEIPTS_DIR:uploads/receipts}

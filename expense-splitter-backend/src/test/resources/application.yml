spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

server:
  port: 8080

jwt:
  secret: test-secret-key-that-is-sufficiently-long-for-hmac-sha-test-purposes
  expiration-ms: 3600000

app:
  default-currency: INR
  ai-service:
    url: http://localhost:8000
    secret: splitwise-ai-internal-secret-2026
    timeout-ms: 5000
  storage:
    receipts-dir: target/test-uploads/receipts
